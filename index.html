<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilstukas</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="./styles/main.css">
</head>
<body>

<div id="loadingScreen" class="loading-screen">
    <div class="loading-logo">Pilstukas</div>
</div>

<div class="app-hud">
        <div class="topbar topbar-main">
            <div class="topbar-inner">
                <div class="brand-wrap">
                    <div class="brand-logo">⛽</div>
                    <div class="brand-text">Pilstukas</div>
                </div>

                <nav class="top-nav">
                    <button class="top-nav-btn" id="navPricesBtn">Kainos</button>
                    <button class="top-nav-btn" id="navStationsBtn">Degalinės</button>
                    <button class="top-nav-btn" id="navFuelBtn">Kuras</button>
                    <button class="top-nav-btn" id="navBrandsBtn">Tinklai</button>
                    <button class="top-nav-btn" id="navRouteBtn">Maršrutas</button>
                </nav>

                <div class="topbar-actions">
                    <button class="theme-toggle topbar-theme-btn" id="themeBtn" title="Keisti temą" aria-label="Keisti temą">🌙</button>
                </div>
            </div>
        </div>

        <div class="topbar topbar-filters hidden-filters" id="stationsFiltersBar">
            <div class="topbar-inner filters-inner">
                <div class="filters-title-row">
                    <div class="filters-title">
                        Visos degalinės
                        <span class="filters-count" id="stationsCountBadge">***</span>
                    </div>

                    <button class="search-fab" id="openRoutePanelBtn" title="Atidaryti maršruto langą" aria-label="Atidaryti maršruto langą">
                        🔎
                    </button>
                </div>

                <div class="filters-row">
                    <select id="countryFilter">
                        <option value="lt">Lietuva</option>
                    </select>

                    <select id="fuelQuickFilter">
                        <option value="">Visi degalų tipai</option>
                        <option value="diesel">Dyzelinas</option>
                        <option value="petrol95">Benzinas 95</option>
                        <option value="petrol98">Benzinas 98</option>
                        <option value="lpg">LPG</option>
                    </select>

                    <select id="brandQuickFilter">
                        <option value="">Visi tinklai</option>
                        <option value="viada">Viada</option>
                        <option value="circlek">Circle K</option>
                        <option value="neste">Neste</option>
                        <option value="orlen">Orlen</option>
                        <option value="balticpetroleum">Baltic Petroleum</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

<div class="panel-wrap" id="panelWrap">
    <div class="panel">
        <div class="panel-topbar">
            <div class="panel-badge">Lietuvos maršrutai</div>
            <button class="close-panel-btn" id="closePanelBtn" title="Uzdaryti meniu" aria-label="Uzdaryti meniu">×</button>
        </div>

        <div class="input-group">
            <div class="location-block">
            <label class="section-label" for="from">Išvykimo vieta</label>
            <div class="location-row">
                <button class="pick-btn" id="pickFromBtn" title="Pasirinkti viršutinį tašką žemėlapyje" aria-label="Pasirinkti viršutinį tašką">📍</button>
                <input type="text" id="from" placeholder="Įvesk išvykimo vietą">
                <button class="move-btn" id="moveFromUpBtn" type="button" title="Perkelti aukštyn" aria-label="Perkelti aukštyn">↑</button>
                <button class="move-btn" id="moveFromDownBtn" type="button" title="Perkelti žemyn" aria-label="Perkelti žemyn">↓</button>
                <button class="clear-btn" id="clearFromBtn" title="Pašalinti viršutinį tašką" aria-label="Pašalinti viršutinį tašką">×</button>
            </div>
        </div>

            <div class="stops-header">
                <span class="section-label">Tarpinės stotelės</span>
                <button class="add-stop-btn" id="addStopBtn" type="button" title="Pridėti tarpinę stotelę" aria-label="Pridėti tarpinę stotelę">+</button>
            </div>

            <div id="waypointContainer"></div>

            <div class="location-block">
                <label class="section-label" for="to">Atvykimo vieta</label>
                <div class="location-row">
                    <button class="pick-btn" id="pickToBtn" title="Pasirinkti apatinį tašką žemėlapyje" aria-label="Pasirinkti apatinį tašką">📍</button>
                    <input type="text" id="to" placeholder="Įvesk atvykimo vietą">
                    <button class="move-btn" id="moveToUpBtn" type="button" title="Perkelti aukštyn" aria-label="Perkelti aukštyn">↑</button>
                    <button class="move-btn" id="moveToDownBtn" type="button" title="Perkelti žemyn" aria-label="Perkelti žemyn">↓</button>
                    <button class="clear-btn" id="clearToBtn" title="Pašalinti apatinį tašką" aria-label="Pašalinti apatinį tašką">×</button>
                </div>
            </div>

            <button class="action-btn primary-btn" id="routeBtn">Rodyti maršrutą</button>

            <div class="info-block">
                <div class="info-line" id="result">Įvesk bent pradžią ir pabaigą.</div>
                <div class="info-line muted" id="mapHint">Maršrutas skaičiuojamas iš viršaus į apačią.</div>
                <div class="info-line distance-line" id="distanceResult"></div>
                <div class="info-line" id="fuelResult"></div>
                <div class="info-line" id="costResult"></div>
            </div>

            <button class="action-btn fuel-toggle-btn" id="fuelToggleBtn">Pasirinkti kurą</button>

            <div class="fuel-expand" id="fuelExpand">
                <div class="fuel-row">
                    <select id="fuelType">
                        <option value="">Kuro tipas, pasirinktinai</option>
                        <option value="diesel">Dyzelinas</option>
                        <option value="petrol98">Benzinas 98</option>
                        <option value="petrol95">Benzinas 95</option>
                        <option value="lpg">LPG</option>
                    </select>

                    <input
                        type="text"
                        id="consumptionInput"
                        placeholder="Sąnaudos, L/100km"
                        disabled
                    >
                </div>

                <button class="action-btn calc-btn" id="calcBtn">🔍 Skaičiuoti</button>
            </div>

        </div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="./js/main.js"></script>

</body>
</html>
