<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marsrutas zemelapyje</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="./styles/main.css">
</head>
<body>

<button class="menu-toggle" id="menuToggleBtn" title="Atidaryti meniu" aria-label="Atidaryti meniu">
    <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>
</button>

<div class="panel-wrap" id="panelWrap">
    <div class="panel">
        <div class="panel-topbar">
            <button class="close-panel-btn" id="closePanelBtn" title="Uzdaryti meniu" aria-label="Uzdaryti meniu">×</button>
        </div>

        <div class="input-group">

            <div class="location-row">
                <input type="text" id="from" placeholder="Isvykimo vieta">
                <button class="pick-btn" id="pickFromBtn" title="Pasirinkti taska A zemelapyje">A</button>
                <button class="clear-btn" id="clearFromBtn" title="Pasalinti taska A">×</button>
            </div>

            <div class="location-row">
                <input type="text" id="to" placeholder="Atvykimo vieta">
                <button class="pick-btn" id="pickToBtn" title="Pasirinkti taska B zemelapyje">B</button>
                <button class="clear-btn" id="clearToBtn" title="Pasalinti taska B">×</button>
            </div>

            <button class="action-btn" id="routeBtn">Rodyti marsruta</button>

            <div class="fuel-row">
                <select id="fuelType">
                    <option value="">Kuro tipas, pasirinktinai</option>
                    <option value="diesel">Dyzelinas</option>
                    <option value="petrol98">Benzinas 98</option>
                    <option value="petrol95">Benzinas 95</option>
                    <option value="lpg">LPG</option>
                </select>

                <input
                    type="text"
                    id="consumptionInput"
                    placeholder="Sanaudos, L/100km"
                    disabled
                >
            </div>

            <button class="action-btn" id="calcBtn">Skaiciuoti</button>

            <div class="info-block">
                <div class="info-line" id="result">Ivesk dvi vietas arba pasirink taskus zemelapyje.</div>
                <div class="info-line muted" id="mapHint">Spausk A arba B mygtuka, tada spausk zemelapyje.</div>
                <div class="info-line" id="distanceResult"></div>
                <div class="info-line" id="fuelResult"></div>
                <div class="info-line" id="costResult"></div>
            </div>

        </div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="./js/main.js"></script>

</body>
</html>
